<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Veckomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #fbf8f2; --ink: #2b2622; --muted: #7a7068; --rule: #e4ddd1; --rule-strong: #cfc5b5;
  --accent: #b8452b; --hl: #f6e9c8;
  --serif: "DM Serif Display", Georgia, "Times New Roman", serif;
  --sans: "Karla", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); padding: 0 20px 64px; }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; line-height: 1.15; }
a { color: var(--accent); }

header.top { padding: 28px 0 0; }
h1 { font-size: 2.6rem; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
nav { display: flex; gap: 22px; margin-top: 18px; border-bottom: 1px solid var(--rule-strong); position: sticky; top: 0; background: var(--paper); z-index: 5; }
nav button { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 0 9px; font: 700 1rem var(--sans); color: var(--muted); cursor: pointer; min-height: 46px; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 3px; }

.prog { margin-top: 14px; font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 12px; }
.prog .line { flex: 1; height: 3px; background: var(--rule); }
.prog .line i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.intro { color: var(--muted); margin: 18px 0 0; font-size: 0.98rem; }
.toggle { appearance: none; background: none; border: 0; padding: 0; margin-top: 10px; font: 500 0.92rem var(--sans); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }

/* Inköpslista */
.cat { margin-top: 34px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.cat-head h3 { font-size: 1.45rem; }
.cat-head span { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-info { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; font-style: italic; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { border-bottom: 1px solid var(--rule); }
ul.items label { display: flex; align-items: flex-start; gap: 14px; padding: 11px 0; cursor: pointer; }
ul.items input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { flex: none; width: 22px; height: 22px; margin-top: 2px; border: 1.5px solid var(--ink); display: grid; place-items: center; }
.box svg { width: 14px; height: 14px; opacity: 0; stroke: var(--accent); }
input:checked + .box svg { opacity: 1; }
.txt { flex: 1; min-width: 0; }
.name { font-weight: 500; }
.note { display: block; color: var(--muted); font-size: 0.85rem; }
.qty { color: var(--ink); font-size: 0.95rem; text-align: right; white-space: nowrap; padding-left: 8px; }
li.done .name, li.done .qty { text-decoration: line-through; text-decoration-color: var(--accent); color: var(--muted); }
li.done .note { opacity: .6; }
li.hide, .cat.hide { display: none; }

/* Dagar */
.dagar { margin-top: 14px; }
.dag { display: grid; grid-template-columns: 5.6rem 1fr; gap: 0 14px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.dag.idag { background: var(--hl); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-bottom-color: transparent; }
.dag.forbi { opacity: .55; }
.dnamn { font-family: var(--serif); font-size: 1.25rem; line-height: 1.15; }
.dnamn small { display: block; font: 500 0.78rem var(--sans); color: var(--muted); margin-top: 4px; }
.dnamn .noah { color: var(--accent); font-weight: 700; }
.dag dl { margin: 0; display: grid; grid-template-columns: 4.6rem 1fr; gap: 3px 10px; font-size: 0.95rem; }
.dag dt { color: var(--muted); }
.dag dd { margin: 0; min-width: 0; }
.dag dd.mid { font-weight: 700; }
.dag dd small { display: block; font-weight: 400; color: var(--muted); font-size: 0.85rem; }

/* Recept */
.recipe { margin-top: 40px; padding-top: 6px; scroll-margin-top: 70px; }
.recipe h3 { font-size: 1.9rem; }
.meta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
.recipe h4 { margin: 22px 0 6px; font: 700 0.78rem var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.recipe ul { margin: 0; padding: 0; list-style: none; columns: 2 220px; column-gap: 28px; }
.recipe ul li { padding: 3px 0; break-inside: avoid; }
.recipe ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.recipe ol li { counter-increment: s; position: relative; padding: 0 0 12px 38px; }
.recipe ol li::before { content: counter(s); position: absolute; left: 0; top: -2px; font: 1.5rem/1.2 var(--serif); color: var(--accent); }
.tip { margin: 18px 0 0; padding-left: 14px; border-left: 3px solid var(--rule-strong); color: var(--muted); font-style: italic; }
.recipe + .recipe { border-top: 1px solid var(--rule-strong); padding-top: 34px; }
@media (prefers-reduced-motion: reduce) { .prog .line i { transition: none; } }
@media (max-width: 420px) { .dag { grid-template-columns: 1fr; gap: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Veckomat</h1>
    <p class="sub" id="sub"></p>
    <nav id="nav" role="tablist">
      <button id="t-handla" role="tab">Handla</button>
      <button id="t-dagar" role="tab">Dagar</button>
      <button id="t-recept" role="tab">Recept</button>
    </nav>
  </header>
  <main id="main"><p class="intro">Laddar veckan...</p></main>
</div>

<script>
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.2L13.5 3.5"/></svg>';
const FLIKAR = ['handla', 'dagar', 'recept'];
let vecka, recept, bockat = {}, dolj = false, flik = 'handla', KEY, DOLJ = 'veckomat:v2:dolj';
const $ = (s, e = document) => e.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const idag = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

async function start() {
  try {
    [vecka, recept] = await Promise.all(['vecka.json', 'recept.json'].map(async (f) => (await fetch(f, { cache: 'no-cache' })).json()));
  } catch (e) {
    $('#main').replaceChildren(el('p', 'intro', 'Kunde inte läsa veckan. Öppna sidan via GitHub Pages eller en lokal server.')); return;
  }
  KEY = 'veckomat:v2:' + vecka.id;
  try { bockat = JSON.parse(lsGet(KEY) || '{}') || {}; } catch (e) { bockat = {}; }
  dolj = lsGet(DOLJ) === '1';
  $('#sub').textContent = `Vecka ${vecka.veckonr} · ${vecka.rubrik}`;
  FLIKAR.forEach((f) => $('#t-' + f).addEventListener('click', () => visa(f, true)));
  const h = location.hash.slice(1);
  visa(FLIKAR.includes(h) ? h : 'handla', false);
}

function visa(id, scroll) {
  flik = id;
  FLIKAR.forEach((f) => $('#t-' + f).setAttribute('aria-selected', String(f === id)));
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  const main = $('#main'); main.replaceChildren();
  ({ handla, dagar, recept: veckansRecept })[id](main);
  if (scroll) window.scrollTo(0, 0);
}

function handla(main) {
  main.append(el('p', 'intro', vecka.anm));
  const prog = el('div', 'prog'), line = el('div', 'line'), fill = el('i'), count = el('span');
  line.append(fill); prog.append(line, count); main.append(prog);
  const hide = el('button', 'toggle', dolj ? 'Visa avbockade' : 'Dölj avbockade');
  hide.addEventListener('click', () => { dolj = !dolj; lsSet(DOLJ, dolj ? '1' : '0'); hide.textContent = dolj ? 'Visa avbockade' : 'Dölj avbockade'; uppdatera(fill, count); });
  main.append(hide);
  vecka.handla.forEach((c) => {
    const sec = el('section', 'cat'), head = el('div', 'cat-head'), cnt = el('span');
    head.append(el('h3', '', c.kat), cnt); sec.append(head);
    if (c.info) sec.append(el('p', 'cat-info', c.info));
    const ul = el('ul', 'items');
    c.rader.forEach((r) => {
      const li = el('li'); li.dataset.id = r.id;
      const lab = el('label'), inp = el('input'), box = el('span', 'box'), txt = el('span', 'txt');
      inp.type = 'checkbox'; box.innerHTML = CHECK;
      txt.append(el('span', 'name', r.namn)); if (r.anm) txt.append(el('span', 'note', r.anm));
      lab.append(inp, box, txt, el('span', 'qty', r.mangd || '')); li.append(lab); ul.append(li);
      inp.addEventListener('change', () => { if (inp.checked) bockat[r.id] = 1; else delete bockat[r.id]; lsSet(KEY, JSON.stringify(bockat)); uppdatera(fill, count); });
    });
    sec.append(ul); sec._cnt = cnt; main.append(sec);
  });
  uppdatera(fill, count);
}

function uppdatera(fill, count) {
  let tot = 0, klar = 0;
  document.querySelectorAll('section.cat').forEach((sec) => {
    const lis = sec.querySelectorAll('li'); let d = 0;
    lis.forEach((li) => {
      const on = !!bockat[li.dataset.id];
      li.querySelector('input').checked = on; li.classList.toggle('done', on); li.classList.toggle('hide', dolj && on);
      if (on) d++;
    });
    sec._cnt.textContent = `${d} av ${lis.length}`; sec.classList.toggle('hide', dolj && d === lis.length);
    tot += lis.length; klar += d;
  });
  count.textContent = `${klar} av ${tot}`;
  fill.style.width = (tot ? klar / tot * 100 : 0) + '%';
}

function dagar(main) {
  const nu = idag();
  main.append(el('p', 'intro', 'Tryck på middagen för receptet.'));
  const lista = el('div', 'dagar');
  vecka.dagar.forEach((d) => {
    const k = el('div', 'dag' + (d.datum === nu ? ' idag' : '') + (d.datum < nu ? ' forbi' : ''));
    const [dag, ...datum] = d.dag.split(' ');
    const namn = el('div', 'dnamn', dag + ' ' + datum.join(' '));
    const liten = el('small'); const noah = d.tag === 'Du + Noah';
    if (d.datum === nu) liten.append('Idag · ');
    if (noah) liten.append(el('span', 'noah', 'Med Noah')); else liten.append(d.tag);
    namn.append(liten);
    const dl = el('dl');
    [['Frukost', d.frukost], ['Lunch', d.lunch], ['Mellanmål', d.mellis]].forEach(([a, b]) => { if (b) dl.append(el('dt', '', a), el('dd', '', b)); });
    const dd = el('dd', 'mid'), m = d.middag;
    let n;
    if (m.recept) { n = el('a', '', m.namn); n.href = '#recept'; n.addEventListener('click', (e) => { e.preventDefault(); visa('recept', false); const t = document.getElementById('r-' + m.recept); if (t) t.scrollIntoView(); }); }
    else n = el('span', '', m.namn);
    dd.append(n); if (m.port) dd.append(el('small', '', m.port));
    dl.append(el('dt', '', 'Middag'), dd);
    k.append(namn, dl); lista.append(k);
  });
  main.append(lista);
}

function receptKort(r) {
  const a = el('article', 'recipe'); a.id = 'r-' + r.id;
  const meta = el('p', 'meta', r.tid + (r.fisk ? ' · fisk' : ''));
  if (r.kalla) { const l = el('a', '', r.kalla.namn); l.href = r.kalla.url; l.target = '_blank'; l.rel = 'noopener'; meta.append(' · Original: ', l); }
  a.append(el('h3', '', r.namn), meta, el('h4', '', 'Ingredienser'));
  const ul = el('ul'); r.ingr.forEach((i) => ul.append(el('li', '', i))); a.append(ul, el('h4', '', 'Gör så här'));
  const ol = el('ol'); r.steg.forEach((s) => ol.append(el('li', '', s))); a.append(ol);
  if (r.tips) a.append(el('p', 'tip', r.tips));
  return a;
}

function veckansRecept(main) {
  main.append(el('p', 'intro', 'Alla recept gäller 4 portioner, så det blir matlådor.'));
  const ids = [...new Set(vecka.dagar.map((d) => d.middag.recept).filter(Boolean))];
  ids.forEach((id) => { const r = recept.find((x) => x.id === id); if (r) main.append(receptKort(r)); });
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (vecka && h !== flik && FLIKAR.includes(h)) visa(h, false); });
start();
</script>
</body>
</html>
